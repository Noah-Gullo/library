<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link href="style.css" rel="stylesheet">
        <script src="script.js" defer></script> 
        <title>Library</title>
    </head>

    <body>
        <h1 id="title">Library</h1>
        <div id="new-button-container">
            <button id="new-book-button">New Book (+)</button>
        </div>

        <div id="delete-btn-container">
            <button id="delete-all-button">Delete All (-)</button>
        </div>

        <dialog closedby="any">
            <form method="dialog" id="popup">
                    <input id="title-field" type="text" minlength="5" placeholder="Book Title" required autofoc></input>
                    <input id="author-field" type="text" minlength="5" placeholder="Author Name" required></input>
                    <input id="page-field" type="number" placeholder="Number of Pages" required></input>
                    <div id="read-container">
                        <label>Have you read it?</label>
                        <input id="has-read" type="checkbox"></input>
                    </div>
                    <button id="submit-button" type="submit">Save</button>
                    <p id="error"></p>
            </form>
        </dialog>
    

        <div id="card-container"></div>
    </body>
</html>
